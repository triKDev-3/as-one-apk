name: Build APK AS ONE Release

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'

  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'URL de l’API'
        required: false
        default: 'https://as-one-apk.onrender.com'

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Release APK
        working-directory: frontend
        env:
          API_URL: ${{ github.event.inputs.api_base_url || 'https://as-one-apk.onrender.com' }}
        run: |
          flutter pub get
          flutter precache --android

          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_URL"

          mkdir -p dist

          cp build/app/outputs/flutter-apk/app-release.apk \
             dist/asone-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: asone-apk-release
          path: frontend/dist/asone-release.apk
          retention-days: 14
          if-no-files-found: error

      - name: Summary
        run: |
          echo "### APK AS ONE Release prête" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Package ID :** \`services.asone.app\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Build :** Release" >> "$GITHUB_STEP_SUMMARY"
          echo "**Artifact :** \`asone-apk-release\`" >> "$GITHUB_STEP_SUMMARY"
