name: Build APK AS ONE

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'URL de l’API'
        required: false
        default: 'https://as-one-apk.onrender.com'
      build_type:
        description: 'Type de build'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

jobs:
  build:
    name: Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Dependencies
        working-directory: frontend
        run: |
          flutter pub get
          flutter precache --android

      - name: Analyze (non-bloquant)
        working-directory: frontend
        continue-on-error: true
        run: flutter analyze --no-fatal-infos || true

      - name: Build APK universel
        working-directory: frontend
        env:
          API_URL: ${{ github.event.inputs.api_base_url || 'https://as-one-apk.onrender.com' }}
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
        run: |
          echo "API_BASE_URL=$API_URL"
          echo "BUILD_TYPE=$BUILD_TYPE"
          if [ "$BUILD_TYPE" = "release" ]; then
            flutter build apk --release \
              --dart-define=API_BASE_URL="$API_URL"
            SRC="build/app/outputs/flutter-apk/app-release.apk"
          else
            flutter build apk --debug \
              --dart-define=API_BASE_URL="$API_URL"
            SRC="build/app/outputs/flutter-apk/app-debug.apk"
          fi
          mkdir -p dist
          cp "$SRC" "dist/asone-${BUILD_TYPE}.apk"
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: asone-apk-${{ github.event.inputs.build_type || 'debug' }}
          path: frontend/dist/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Summary
        run: |
          echo "### APK AS ONE prêt" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package ID :** \`services.asone.app\`" >> $GITHUB_STEP_SUMMARY
          echo "**API :** \`${{ github.event.inputs.api_base_url || 'https://as-one-apk.onrender.com' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Désinstalle l’ancienne app AS ONE" >> $GITHUB_STEP_SUMMARY
          echo "2. Télécharge l’artifact **asone-apk-debug**" >> $GITHUB_STEP_SUMMARY
          echo "3. Installe \`asone-debug.apk\`" >> $GITHUB_STEP_SUMMARY
