name: Restore compose_team_screen
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode gzip+base64 compose
        run: |
          cat frontend/lib/features/chef/screens/.compose_b64/compose.gz.b64.part* | tr -d '\n' | base64 -d | gzip -d > frontend/lib/features/chef/screens/compose_team_screen.dart
          wc -c frontend/lib/features/chef/screens/compose_team_screen.dart
          head -3 frontend/lib/features/chef/screens/compose_team_screen.dart
          grep -q ComposeTeamScreen frontend/lib/features/chef/screens/compose_team_screen.dart
      - name: Commit
        run: |
          git config user.name "AS ONE Bot"
          git config user.email "bot@asone.local"
          git add frontend/lib/features/chef/screens/compose_team_screen.dart
          git diff --staged --quiet && echo No change && exit 0
          git commit -m "restore: compose_team_screen full (renvoyer/rappel/liberer)"
          git push
