name: asone_app
description: AS ONE Facility Management — Application multi-plateforme
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.3+1
  shared_preferences: ^2.2.3
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.0
  socket_io_client: ^2.0.3+1
  flutter_animate: ^4.5.0
  image_picker: ^1.2.3
  permission_handler: ^11.3.1
  table_calendar: ^3.1.2
  google_sign_in: ^6.2.1
  googleapis: ^17.0.0
  googleapis_auth: ^2.3.3
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  share_plus: ^13.3.0
  youtube_player_flutter: ^10.0.1
  carousel_slider: ^5.1.2
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo_full.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logo_full.png"
    background_color: "#FFFFFF"
    theme_color: "#005C9C"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
